<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiraKel Apartados</title>
<meta name="description" content="Apartados y estados de cuenta de MiraKel Accesorios">
<meta name="theme-color" content="#D78BB1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiraKel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: header de marca + navegación; contenido en una columna amplia (máx. 1120px); barra inferior en móvil. */
:root{
  --bg:#FCF5F9;          /* rosa casi blanco */
  --surface:#FFFFFF;
  --blush:#F7D9E8;       /* rosa polvo del brand board */
  --blush-2:#FBEAF2;
  --rose:#D78BB1;        /* rosa MiraKel */
  --rose-deep:#B5608D;   /* botón principal (contraste con blanco) */
  --rose-ink:#9E4F7A;    /* texto en rosa sobre blanco */
  --hot:#FC76B9;         /* acento vivo, en dosis pequeñas */
  --mkl:#EBC2D7;         /* monograma */
  --gold:#A8874C;        /* dorado de la joyería */
  --kraft:#B48A5E;       /* empaque kraft */
  --ink:#4A4448;
  --muted:#857880;
  --line:#EFD9E4;
  --on-primary:#FFFFFF;
  --shadow:0 1px 2px rgba(120,60,90,.06),0 8px 24px -12px rgba(120,60,90,.18);
  --st-pend:#7A6D74; --st-pend-bg:#F1E9ED;
  --st-abon:#9E4F7A; --st-abon-bg:#F9E1EC;
  --st-prox:#8A6420; --st-prox-bg:#F6EBD3;
  --st-venc:#A1324F; --st-venc-bg:#F7D7DF;
  --st-liq:#3F7556;  --st-liq-bg:#DCEEE3;
  --wa:#2F8F5B;
  --f-display:"Cormorant Garamond","Cormorant",Didot,"Bodoni 72",Georgia,serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1519; --surface:#271D23; --blush:#3A2731; --blush-2:#30222A;
  --rose:#E2A2C3; --rose-deep:#D98AB4; --rose-ink:#F0B6D3; --hot:#FF8DC4; --mkl:#4A3340;
  --gold:#D8B97C; --kraft:#C9A27A; --ink:#F4E9EF; --muted:#BCA6B2; --line:#40303A; --on-primary:#2A1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --st-pend:#CDBCC5; --st-pend-bg:#3A2E35; --st-abon:#F3B8D5; --st-abon-bg:#4A2B3B;
  --st-prox:#E9C77F; --st-prox-bg:#463722; --st-venc:#FF9DB3; --st-venc-bg:#4D2430;
  --st-liq:#9DD5B2; --st-liq-bg:#23392C; --wa:#5FC48C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1D1519; --surface:#271D23; --blush:#3A2731; --blush-2:#30222A;
  --rose:#E2A2C3; --rose-deep:#D98AB4; --rose-ink:#F0B6D3; --hot:#FF8DC4; --mkl:#4A3340;
  --gold:#D8B97C; --kraft:#C9A27A; --ink:#F4E9EF; --muted:#BCA6B2; --line:#40303A; --on-primary:#2A1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --st-pend:#CDBCC5; --st-pend-bg:#3A2E35; --st-abon:#F3B8D5; --st-abon-bg:#4A2B3B;
  --st-prox:#E9C77F; --st-prox-bg:#463722; --st-venc:#FF9DB3; --st-venc-bg:#4D2430;
  --st-liq:#9DD5B2; --st-liq-bg:#23392C; --wa:#5FC48C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
.app{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:env(safe-area-inset-top,0px) 110px}
@media (min-width:761px){.app{padding-bottom:56px}}

/* Encabezado */
.top{display:flex;align-items:center;gap:18px;padding-block:18px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-logo{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.brand-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.firma{display:block;width:138px;aspect-ratio:822/174;background-color:var(--rose-ink);-webkit-mask:var(--firma-url) center/contain no-repeat;mask:var(--firma-url) center/contain no-repeat}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-liq);flex:none}
.sync.subiendo::before{background:var(--st-prox);animation:latido 1s ease-in-out infinite}
.sync.offline::before{background:var(--st-venc)}
.sync.ok{color:var(--st-liq)}
@keyframes latido{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.subiendo::before{animation:none}}
.version{font-size:11.5px;color:var(--muted);text-align:center;margin:28px 0 0}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--blush-2)}
.tab[aria-current="page"]{color:var(--rose-ink);background:var(--blush);font-weight:600}
@media (max-width:760px){.tabs{display:none}.brand-logo{width:44px;height:44px}.firma{width:112px}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--rose);background:var(--blush-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-primary)}
.btn-primary:hover{background:var(--rose-ink);border-color:var(--rose-ink);color:var(--on-primary)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.07);background:var(--wa);border-color:var(--wa)}
:root[data-theme="dark"] .btn-wa{color:#10251A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-wa{color:#10251A}}
.btn-ghost{border-color:transparent;background:transparent;color:var(--rose-ink);padding-inline:10px}
.btn-ghost:hover{background:var(--blush-2);border-color:transparent}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn-danger{color:var(--st-venc);border-color:var(--st-venc-bg)}
.btn-danger:hover{background:var(--st-venc-bg);border-color:var(--st-venc)}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--blush-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* Avisos */
.banner{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-sm);background:var(--blush-2);border:1px dashed var(--rose);font-size:13px}
.banner b{color:var(--rose-ink)}
.banner .btn{margin-left:auto}

/* Secciones */
.view{padding-top:26px;display:grid;gap:28px}
.view-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.view-head h1{font-size:clamp(32px,5vw,44px);font-weight:500}
.view-head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.view-head .grow{margin-right:auto;min-width:0}
.sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-title h2{font-size:26px;font-weight:500}
.sec-title .count{font-size:12px;color:var(--muted);font-weight:600}
.sec-title .grow{margin-left:auto}

/* Hero de inicio */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:linear-gradient(140deg,var(--blush) 0%,var(--blush-2) 70%);padding:28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-20px;top:18px;width:300px;aspect-ratio:446/226;background-color:var(--rose);opacity:.35;-webkit-mask:var(--wings-url) center/contain no-repeat;mask:var(--wings-url) center/contain no-repeat;pointer-events:none}
.hero-main{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .label{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-ink)}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(46px,8vw,72px);line-height:1;color:var(--ink)}
.hero .big small{font-size:.45em;color:var(--muted);font-weight:500}
.hero .note{color:var(--muted);font-size:13.5px}
.hero-stats{position:relative;z-index:1;display:grid;gap:10px;align-content:end}
.mini{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;border:1px solid var(--line)}
.mini span{font-size:12.5px;color:var(--muted);font-weight:500}
.mini b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.mini .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero::after{width:200px;right:-40px}}

.grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--blush-2)}
.row .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1}
.row-act{display:flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--rose-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:18px;flex:none}
.empty{padding:34px 20px;text-align:center;display:grid;justify-items:center;gap:10px;color:var(--muted);font-size:14px}
.empty::before{content:"";width:120px;aspect-ratio:446/226;background-color:var(--rose);opacity:.55;-webkit-mask:var(--wings-url) center/contain no-repeat;mask:var(--wings-url) center/contain no-repeat}
.empty h3{font-size:24px;color:var(--ink);font-weight:500}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--st-pend-bg);color:var(--st-pend)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pendiente{background:var(--st-pend-bg);color:var(--st-pend)}
.pill.abonando{background:var(--st-abon-bg);color:var(--st-abon)}
.pill.proximo{background:var(--st-prox-bg);color:var(--st-prox)}
.pill.vencido{background:var(--st-venc-bg);color:var(--st-venc)}
.pill.liquidado{background:var(--st-liq-bg);color:var(--st-liq)}
.flag{font-size:11.5px;font-weight:600;color:var(--st-prox)}

/* Gráfica */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 18px 12px}
.chart-card svg{width:100%;height:auto;display:block}
.chart-card .cap{font-size:12.5px;color:var(--muted);margin-top:6px}

/* Ficha */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--rose-ink);font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;padding:4px 0}
.back svg{width:16px;height:16px}
.ficha-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ficha-head .avatar{width:64px;height:64px;font-size:28px}
.ficha-head .info{margin-right:auto;min-width:0}
.ficha-head h1{font-size:clamp(32px,5vw,42px);font-weight:500}
.contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13.5px;color:var(--muted);align-items:center}
.contact b{color:var(--ink);font-weight:600}
.notes{background:var(--blush-2);border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;color:var(--ink);white-space:pre-wrap}
.sum-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.sum-strip div{background:var(--surface);padding:14px 16px}
.sum-strip span{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sum-strip b{font-family:var(--f-display);font-size:28px;font-weight:600}
@media (max-width:520px){.sum-strip b{font-size:22px}.sum-strip div{padding:12px}}

.cuentas{display:grid;gap:18px}
.cuenta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
.cuenta-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.cuenta-head h3{font-size:26px;font-weight:600}
.cuenta-head .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nums span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nums b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15}
.nums .saldo b{color:var(--rose-ink)}
.prog{height:10px;border-radius:999px;background:var(--blush);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--rose),var(--hot))}
.prog.liq i{background:linear-gradient(90deg,var(--gold),var(--rose))}
.prog-l{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.prog-l b{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions.sec{padding-top:12px;border-top:1px solid var(--line)}
details.hist{border-top:1px solid var(--line);padding-top:10px}
details.hist summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--rose-ink);list-style:none;display:flex;align-items:center;gap:6px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.hist[open] summary::before{transform:rotate(45deg)}
.hist-list{margin-top:10px;display:grid;gap:0;font-size:13.5px}
.hist-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.hist-item:first-child{border-top:0}
.hist-item .d{color:var(--muted);font-size:12.5px;min-width:86px}
.hist-item .m{font-weight:600}
.hist-item .x{font-size:12px;color:var(--muted)}
@media (max-width:520px){.cuenta .actions:not(.sec) .btn{flex:1 1 100%}.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.nums .saldo{grid-column:1/-1}.cuenta{padding:18px}}

/* Filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip b{font-weight:700;margin-left:4px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.ledger .row{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
.ledger .dates{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.ledger .row{grid-template-columns:minmax(0,1fr) auto}.ledger .dates{display:none}}

/* Ajustes */
.settings{display:grid;gap:26px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;gap:16px}
.panel h2{font-size:26px;font-weight:500}
.panel .lead{color:var(--muted);font-size:13.5px;max-width:68ch}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,textarea.msg{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,textarea.msg:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--blush)}
.field .help{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--st-venc);font-weight:600}
textarea{resize:vertical;line-height:1.5}
.tpl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:18px;padding-top:18px;border-top:1px solid var(--line)}
.tpl:first-of-type{border-top:0;padding-top:0}
.tpl h3{font-size:22px;font-weight:600}
.tpl .when{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.tpl textarea{min-height:220px;font-size:13.5px}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.var{border:1px dashed var(--rose);background:none;color:var(--rose-ink);font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer}
.var:hover{background:var(--blush-2)}
.bubble-wrap{background:var(--blush-2);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px}
.bubble-wrap .lbl{margin-bottom:2px}
.bubble{align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:760px){.tpl{grid-template-columns:1fr}}
.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px;color:var(--ink)}
.save-bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* Hoja / modal */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(40,18,30,.42);backdrop-filter:blur(2px)}
.sheet{position:relative;background:var(--surface);width:min(620px,100%);max-height:92%;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
@media (min-width:761px){.sheet-wrap{align-items:center}.sheet{border-radius:var(--r-lg);padding:26px}}
.sheet.wide{width:min(760px,100%)}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:28px;font-weight:500;margin-right:auto}
.sheet-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
.sheet .hint{font-size:12.5px;color:var(--muted)}
textarea.msg{min-height:260px;font-size:14px}
.confirm-box{display:grid;gap:10px;padding:14px;border-radius:var(--r-sm);background:var(--st-venc-bg);color:var(--ink)}
.done-box{display:grid;gap:6px;padding:16px;border-radius:var(--r-md);background:var(--blush-2);text-align:center}
.done-box .big{font-family:var(--f-display);font-size:40px;font-weight:600;color:var(--rose-ink);line-height:1}
.ec-preview{background:var(--blush-2);border-radius:var(--r-md);padding:14px;display:grid;place-items:center;min-height:200px}
.ec-preview img{width:min(380px,100%);border-radius:10px;box-shadow:var(--shadow)}
.sep-or{font-size:12px;color:var(--muted);text-align:center}

/* Navegación inferior (móvil) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom-nav .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:12px}
.bn svg{width:22px;height:22px}
.bn[aria-current="page"]{color:var(--rose-ink)}
.bn[aria-current="page"] svg{stroke-width:1.8}
@media (max-width:760px){.bottom-nav{display:block}.top .btn-primary span{display:none}.top .btn-primary{padding:10px 12px}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (min-width:761px){.toast{bottom:28px}}
.skel{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--blush-2),var(--blush),var(--blush-2));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 80% at 50% 0%,var(--blush) 0%,var(--bg) 60%)}
.login-card{width:min(390px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px 22px 26px;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.login-card img{width:108px;height:108px;border-radius:50%;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.login-card .firma{width:170px}
.login-card form{display:grid;gap:12px;width:100%;text-align:left;margin-top:6px}
.login-card .btn{width:100%;padding:13px}
.login-card .err{font-size:13px;color:var(--st-venc);font-weight:600;text-align:center}
.login-card .hint{font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

  <div class="login-card">
    <img src="assets/logo.png" alt="MiraKel Accesorios">

      <div class="field"><label for="l-user">Usuario</label><input id="l-user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password"></div>

</div>
<div id="app-shell" hidden>
<div class="app">
  <header class="top">

  </header>
  <div id="banner"></div>
  <main id="main"><div class="view"><div class="skel"></div><div class="skel" style="height:220px"></div></div></main>

</div>

<nav class="bottom-nav" aria-label="Secciones">
  <div class="in">
    <button class="bn" data-act="nav" data-view="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="bn" data-act="nav" data-view="clientas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>Clientas</button>

  </div>
</nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet" id="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script>
(function(){
"use strict";
/* ============ Recursos de marca (extraídos de tu logo) ============ */
const LOGO_SRC = document.querySelector('.brand-logo').src;
const WINGS_SRC = "assets/wings.png";
const FIRMA_SRC = "assets/firma.png";
document.documentElement.style.setProperty('--wings-url', 'url("'+WINGS_SRC+'")');
document.documentElement.style.setProperty('--firma-url', 'url("'+FIRMA_SRC+'")');

/* ============ Configuración por defecto ============ */
const PLANTILLAS_BASE = {
  estadoCuenta:
"Hola, {nombre} ✨\n\nTe compartimos el estado actual de tu cuenta con {negocio}.\n\nProducto:\n{producto}\n\nTotal de compra:\n{total}\n\nTotal abonado:\n{abonado}\n\nSaldo pendiente:\n{saldo}\n\nPróximo pago:\n{proximoPago}\n\nFecha límite para liquidar:\n{fechaLimite}\n\nEstado:\n{estado}\n\nGracias por tu compra ♡",
  liquidada:
"Hola, {nombre} ✨\n\nTu compra con {negocio} se encuentra totalmente LIQUIDADA.\n\nProducto:\n{producto}\n\nTotal pagado:\n{total}\n\nMuchas gracias por tu compra y por tu confianza ♡",
  recordatorioNormal:
"Hola, {nombre} ✨\nTe recordamos que tu próximo pago de {montoProximo} está programado para el {proximoPago}.\n\nSaldo pendiente: {saldo}\n\nGracias por tu preferencia ♡\n{negocio}",
  proximoVencer:
"Hola, {nombre} ✨\nTe recordamos que queda un saldo pendiente de {saldo} y la fecha límite es el {fechaLimite}.\n\nSi tienes cualquier duda, con gusto te ayudamos ♡\n{negocio}",
  vencido:
"Hola, {nombre}.\nTe compartimos un recordatorio de que actualmente existe un saldo pendiente de {saldo} y la fecha acordada de pago fue el {fechaLimite}.\nPor favor ponte en contacto con nosotros para revisar tu cuenta.\n\nGracias,\n{negocio}",
  confirmacionAbono:
"Hola, {nombre} ✨\n\nHemos registrado tu abono de:\n\n{abono}\n\nTu cuenta queda de la siguiente manera:\n\nTotal abonado:\n{abonado}\n\nSaldo restante:\n{saldo}\n\nGracias ♡"
};
const PLANTILLAS_INFO = [
  ['estadoCuenta','Estado de cuenta','Botón “Enviar por WhatsApp” en una cuenta con saldo.'],
  ['recordatorioNormal','Recordatorio normal','Cuando la clienta todavía tiene tiempo para su próximo pago.'],
  ['proximoVencer','Próximo a vencer','Cuando faltan pocos días para la fecha límite o ya pasó la fecha de su próximo pago.'],
  ['vencido','Vencido','Cuando ya pasó la fecha límite y queda saldo.'],
  ['confirmacionAbono','Confirmación de abono','Después de registrar un abono que no termina de pagar la cuenta.'],
  ['liquidada','Cuenta liquidada','Cuando la cuenta queda en $0: sustituye al estado de cuenta, al recordatorio y a la confirmación de abono.']
];
const VARS = [
  ['nombre','Nombre'],['nombreCompleto','Nombre completo'],['negocio','Negocio'],['producto','Producto'],['total','Total de compra'],
  ['abonado','Total abonado'],['saldo','Saldo'],['porcentaje','% pagado'],['proximoPago','Fecha próximo pago'],
  ['montoProximo','Monto próximo pago'],['fechaLimite','Fecha límite'],['estado','Estado'],['abono','Abono registrado']
];
const DEF_AJUSTES = {
  negocio:'MiraKel Accesorios', whatsapp:'', instagram:'', lada:'52', diasAviso:7,
  plantillas:Object.assign({}, PLANTILLAS_BASE),
  /* Preparado para conectar después un proveedor (WhatsApp Business Platform / Meta u otro).
     Mientras proveedor sea null, todos los envíos son manuales con enlace de WhatsApp. */
  automatizacion:{activo:false, proveedor:null}
};
const ESTADOS = {
  pendiente:'Pendiente', abonando:'Abonando', proximo:'Próximo a vencer', vencido:'Vencido', liquidado:'Liquidado'
};
const TIPO_MSG = {
  estadoCuenta:'Estado de cuenta', liquidada:'Cuenta liquidada', recordatorioNormal:'Recordatorio',
  proximoVencer:'Recordatorio · próximo a vencer', vencido:'Recordatorio · vencido', confirmacionAbono:'Confirmación de abono'
};

/* ============ Estado de la app ============ */
const data = { clientas:{}, cuentas:{}, ajustes:null, cargado:{clientas:false, cuentas:false} };
const ui = { view:'inicio', clientaId:null, filtro:'todos', q:'', openDetails:new Set(), sheet:null, ec:null };

/* ============ Datos: se guardan en automático en Cloudflare ============
   Cada cambio se sube solo. Si no hay internet, se guarda en el teléfono y se sube
   en cuanto vuelva la señal. El usuario y la contraseña viven en Cloudflare, no aquí. */
const CLAVE_DATOS = 'mirakel-datos';      // copia local para abrir rápido y sin señal
const CLAVE_PENDIENTES = 'mirakel-pendientes';
const CLAVE_SESION = 'mirakel-sesion';
const CLAVE_SUBIDO = 'mirakel-subido';
const CLAVE_GUARDADO = 'mirakel-ultimo-guardado';
const VERSION_APP = '3.1';
document.querySelectorAll('[data-version]').forEach(el=>{ el.textContent = 'Versión ' + VERSION_APP; });

function leerJSON(k, def){ try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : def; } catch(e){ return def; } }
function escribirJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ console.error(e); } }
function guardarCopia(){ escribirJSON(CLAVE_DATOS, { clientas:data.clientas, cuentas:data.cuentas, ajustes:data.ajustes }); }

class ErrorApi extends Error { constructor(status, codigo){ super(codigo||('HTTP '+status)); this.status=status; this.codigo=codigo; } }
async function api(metodo, ruta, cuerpo){
  const s = leerJSON(CLAVE_SESION, null);
  const headers = { 'content-type':'application/json' };
  if (s && s.token) headers.authorization = 'Bearer ' + s.token;
  const r = await fetch('api/' + ruta, { method:metodo, headers, body: cuerpo===undefined ? undefined : JSON.stringify(cuerpo), cache:'no-store' });
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j) throw new ErrorApi(r.status, j && j.error);
  return j;
}
const sinConexion = (e)=>!(e instanceof ErrorApi);

function explicarError(e){
  if (sinConexion(e)) return 'Sin conexión. Tus cambios quedan guardados en el teléfono y se suben solos cuando vuelva la señal.';
  if (e.status===404 || e.status===405) return 'La app no encuentra el servidor de Cloudflare. Ábrela desde su dirección de Cloudflare Pages.';
  if (e.codigo==='config') return 'Falta configurar Cloudflare (base de datos DB, USUARIO y CONTRASENA).';
  if (e.status===401) return 'Tu sesión expiró. Vuelve a entrar.';
  return 'No se pudo guardar en Cloudflare (' + e.message + '). Se reintentará solo.';
}

/* Indicador de guardado: en el encabezado, con la hora del último guardado en Cloudflare. */
function horaGuardado(iso){
  const d = new Date(iso); if (isNaN(d)) return '';
  const hora = d.toLocaleTimeString('es-MX', { hour:'numeric', minute:'2-digit' });
  return d.toDateString()===new Date().toDateString() ? hora : d.toLocaleDateString('es-MX', { day:'numeric', month:'short' }) + ', ' + hora;
}
function renderSync(){
  const el = $('#sync'); if (!el) return;
  const pend = leerJSON(CLAVE_PENDIENTES, []).length;
  const ultimo = leerJSON(CLAVE_GUARDADO, null);
  let cls, txt;
  if (Store.subiendo && pend){ cls='subiendo'; txt='Guardando en la nube…'; }
  else if (Store.error || pend){ cls='offline'; txt = pend ? (pend===1 ? '1 cambio sin subir' : pend+' cambios sin subir') : 'Sin conexión'; }
  else { cls='ok'; txt = ultimo ? 'Guardado en la nube · ' + horaGuardado(ultimo) : 'Al día en la nube'; }
  el.className = 'sync ' + cls; el.textContent = txt;
  el.title = ultimo ? 'Último guardado: ' + new Date(ultimo).toLocaleString('es-MX') : '';
}

const Store = {
  mode:'cargando', user:null, error:null, ultimaCarga:0, subiendo:false,
  async init(){
    const s = leerJSON(CLAVE_SESION, null);
    if (s && s.token){ this.user={ nombre:s.nombre }; mostrarApp(); await this.cargar(); }
    else mostrarLogin();
  },
  aplicarPendientes(){
    for (const op of leerJSON(CLAVE_PENDIENTES, [])){
      if (op.coll==='ajustes'){ if (op.tipo==='put') data.ajustes = op.data; continue; }
      if (op.tipo==='put') data[op.coll][op.id] = Object.assign({}, op.data, {id:op.id});
      else delete data[op.coll][op.id];
    }
  },
  async cargar(){
    try{
      const d = await api('GET', 'datos');
      const local = leerJSON(CLAVE_DATOS, null);
      const vacio = !Object.keys(d.clientas).length && !Object.keys(d.cuentas).length;
      // Primera vez: si el teléfono ya tenía datos guardados, se suben solos a Cloudflare.
      if (vacio && !leerJSON(CLAVE_SUBIDO, false) && local && (Object.keys(local.clientas||{}).length || Object.keys(local.cuentas||{}).length)){
        await api('POST', 'importar', local);
        Object.assign(d, { clientas:local.clientas||{}, cuentas:local.cuentas||{}, ajustes:local.ajustes||d.ajustes });
      }
      escribirJSON(CLAVE_SUBIDO, true);
      data.clientas = d.clientas; data.cuentas = d.cuentas; data.ajustes = d.ajustes;
      this.aplicarPendientes(); guardarCopia();
      this.error=null; this.ultimaCarga=Date.now();
    }catch(e){
      console.error(e);
      if (e.status===401){ this.salir(); return; }
      const d = leerJSON(CLAVE_DATOS, {}) || {};
      data.clientas = d.clientas||{}; data.cuentas = d.cuentas||{}; data.ajustes = d.ajustes||null;
      this.aplicarPendientes();
      this.error = explicarError(e);
    }
    this.mode='nube';
    data.cargado.clientas = data.cargado.cuentas = true;
    render();
    this.subir();
  },
  async subir(){
    if (this.subiendo) return; this.subiendo = true; renderSync();
    try{
      let cola = leerJSON(CLAVE_PENDIENTES, []);
      while (cola.length){
        const op = cola[0];
        if (op.tipo==='put') await api('PUT', 'registro/'+op.coll+'/'+encodeURIComponent(op.id), op.data);
        else await api('DELETE', 'registro/'+op.coll+'/'+encodeURIComponent(op.id));
        cola = leerJSON(CLAVE_PENDIENTES, []); cola.shift(); escribirJSON(CLAVE_PENDIENTES, cola);
        escribirJSON(CLAVE_GUARDADO, new Date().toISOString()); renderSync();
      }
      if (this.error){ this.error=null; render(); }
      renderSync();
    }catch(e){
      console.error(e);
      if (e.status===401){ this.subiendo=false; this.salir(); return; }
      this.error = explicarError(e); render();
    }
    this.subiendo = false; renderSync();
  },
  encolar(op){ const cola = leerJSON(CLAVE_PENDIENTES, []); cola.push(op); escribirJSON(CLAVE_PENDIENTES, cola); guardarCopia(); render(); this.subir(); },
  newId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); },
  async put(coll, id, obj){
    const body = Object.assign({}, obj); delete body.id;
    data[coll][id] = Object.assign({}, body, {id});
    this.encolar({ tipo:'put', coll, id, data:body });
  },
  async del(coll, id){
    delete data[coll][id];
    this.encolar({ tipo:'del', coll, id });
  },
  async putAjustes(obj){
    data.ajustes = obj;
    this.encolar({ tipo:'put', coll:'ajustes', id:'general', data:obj });
  },
  async importar(respaldo){
    const r = await api('POST', 'importar', { clientas:respaldo.clientas||{}, cuentas:respaldo.cuentas||{}, ajustes:respaldo.ajustes||null });
    escribirJSON(CLAVE_GUARDADO, new Date().toISOString());
    await this.cargar();
    return { clientas:r.clientas, cuentas:r.cuentas };
  },
  salir(){
    try{ [CLAVE_SESION, CLAVE_DATOS, CLAVE_PENDIENTES, CLAVE_GUARDADO].forEach(k=>localStorage.removeItem(k)); }catch(e){}
    this.user=null; this.error=null; data.clientas={}; data.cuentas={}; data.ajustes=null; mostrarLogin();
  }
};

/* ============ Inicio de sesión ============ */
function mostrarLogin(){
  $('#app-shell').hidden = true; $('#login').hidden = false;
  const e = $('#l-user'); if (e) setTimeout(()=>e.focus(), 50);
}
function mostrarApp(){ $('#login').hidden = true; $('#app-shell').hidden = false; }
document.getElementById('f-login').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const usuario = $('#l-user').value.trim(), contrasena = $('#l-pass').value;
  const msg = $('#l-err'), btn = $('#l-btn');
  if (!usuario || !contrasena){ msg.textContent='Escribe tu usuario y tu contraseña.'; msg.hidden=false; return; }
  btn.disabled = true; btn.textContent = 'Entrando…'; msg.hidden = true;
  try{
    const r = await api('POST', 'login', { usuario, contrasena });
    escribirJSON(CLAVE_SESION, { token:r.token, nombre:r.nombre });
    Store.user = { nombre:r.nombre }; $('#l-pass').value=''; mostrarApp(); await Store.cargar();
  }catch(e){
    msg.textContent = e.status===401 ? 'Usuario o contraseña incorrectos.' : explicarError(e); msg.hidden = false;
  }
  btn.disabled = false; btn.textContent = 'Entrar';
});
window.addEventListener('online', ()=>{ if (Store.user) Store.subir(); });
window.addEventListener('offline', ()=>{ if (Store.user) renderSync(); });
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden && Store.user && Date.now()-Store.ultimaCarga > 30000 && $('#sheet').hidden && !ui.ajustesDirty) Store.cargar();
});

/* ============ Utilidades ============ */
const $ = (s, el=document)=>el.querySelector(s);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = (n)=>Math.round((Number(n)||0)*100)/100;
function money(n){
  n=r2(n); const dec = Math.abs(n%1)>0.001;
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:dec?2:0,maximumFractionDigits:2}).format(n);
}
function moneyShort(n){ return n>=1000 ? '$'+(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k' : money(n); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dias(a,b){ return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5); }
function sumarDias(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fCorta(iso){ if(!iso) return '—'; return new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}).replace('.',''); }
function fLarga(iso){ if(!iso) return ''; return new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}); }
function iniciales(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase()||'?'; }
function primerNombre(n){ return String(n||'').trim().split(/\s+/)[0]||''; }
function telBonito(t){ const d=String(t||'').replace(/\D/g,''); if(d.length===10) return d.slice(0,2)+' '+d.slice(2,6)+' '+d.slice(6); return t||''; }
function aj(){ const a=Object.assign({}, DEF_AJUSTES, data.ajustes||{}); a.plantillas=Object.assign({}, PLANTILLAS_BASE, (data.ajustes&&data.ajustes.plantillas)||{}); a.automatizacion=Object.assign({}, DEF_AJUSTES.automatizacion, (data.ajustes&&data.ajustes.automatizacion)||{}); return a; }
function hayEjemplos(){ return Object.values(data.clientas).some(c=>c.ejemplo) || Object.values(data.cuentas).some(c=>c.ejemplo); }

/* Cálculo de una cuenta: saldo, % y estado — siempre desde los datos guardados */
function calc(c){
  const abonos = Array.isArray(c.abonos)?c.abonos:[];
  const abonado = r2(abonos.reduce((s,a)=>s+(Number(a.monto)||0),0));
  const monto = r2(c.monto);
  const saldo = Math.max(0, r2(monto-abonado));
  const pct = monto>0 ? Math.min(100, Math.round(abonado/monto*100)) : 0;
  const hoy = hoyISO(); const A = aj();
  let estado;
  if (saldo<=0.009 && monto>0) estado='liquidado';
  else if (c.fechaLimite && hoy>c.fechaLimite) estado='vencido';
  else if (c.fechaLimite && dias(hoy,c.fechaLimite)<=Number(A.diasAviso||7)) estado='proximo';
  else if (abonado>0) estado='abonando';
  else estado='pendiente';
  const atrasado = estado!=='liquidado' && estado!=='vencido' && c.proximoPago && c.proximoPago<hoy;
  const montoProximo = estado==='liquidado' ? 0 : Math.min(saldo, Number(c.montoProximo)>0?r2(c.montoProximo):saldo);
  return {abonado, saldo, pct, estado, atrasado, montoProximo, monto};
}
function pill(estado){ return '<span class="pill '+estado+'">'+ESTADOS[estado]+'</span>'; }

/* ============ Mensajes ============ */
function variables(c, extra){
  extra=extra||{};
  const k=calc(c), cl=data.clientas[c.clientaId]||extra.clienta||{}, A=aj();
  return {
    nombre: primerNombre(cl.nombre), nombreCompleto: cl.nombre||'', negocio: A.negocio||'', producto: c.producto||'',
    total: money(k.monto), abonado: money(k.abonado), saldo: money(k.saldo), porcentaje: k.pct+'%',
    proximoPago: c.proximoPago ? fLarga(c.proximoPago) : 'por definir', montoProximo: money(k.montoProximo),
    fechaLimite: c.fechaLimite ? fLarga(c.fechaLimite) : 'por definir', estado: ESTADOS[k.estado],
    abono: extra.abono!=null ? money(extra.abono) : ''
  };
}
function rellenar(tpl, v){ return String(tpl||'').replace(/\{(\w+)\}/g, (m,k)=> Object.prototype.hasOwnProperty.call(v,k) ? v[k] : m); }
/* tipo: 'estado' | 'recordatorio' | 'abono' → elige la plantilla según el estado real de la cuenta */
function plantillaPara(tipo, c){
  const k=calc(c);
  if(k.estado==='liquidado') return 'liquidada';
  if(tipo==='estado') return 'estadoCuenta';
  if(tipo==='abono') return 'confirmacionAbono';
  if(k.estado==='vencido') return 'vencido';
  if(k.estado==='proximo' || k.atrasado) return 'proximoVencer';
  return 'recordatorioNormal';
}
function construirMensaje(tipo, c, extra){
  const key=plantillaPara(tipo,c);
  return {key, texto: rellenar(aj().plantillas[key], variables(c,extra))};
}
function telWa(t){ let d=String(t||'').replace(/\D/g,''); if(!d) return ''; if(d.length===10) d=String(aj().lada||'52').replace(/\D/g,'')+d; return d; }

function chartAbonos(){
  const meses=[]; const d=new Date(); d.setDate(1);
  for(let i=5;i>=0;i--){ const m=new Date(d.getFullYear(), d.getMonth()-i, 1); meses.push({k:m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'), l:m.toLocaleDateString('es-MX',{month:'short'}).replace('.',''), v:0}); }
  Object.values(data.cuentas).forEach(c=>(c.abonos||[]).forEach(a=>{ const mm=meses.find(x=>x.k===String(a.fecha).slice(0,7)); if(mm) mm.v+=Number(a.monto)||0; }));
  const max=Math.max(1,...meses.map(m=>m.v)); const W=560,H=200,pb=28,pt=26,bw=52; const gap=(W-meses.length*bw)/(meses.length);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Abonos recibidos por mes">';
  [0.5,1].forEach(f=>{ const y=pt+(H-pb-pt)*(1-f); s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 5"/>'; });
  s+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  meses.forEach((m,i)=>{ const x=gap/2+i*(bw+gap); const hh=(H-pb-pt)*(m.v/max); const y=H-pb-hh; const last=i===meses.length-1;
    if(m.v>0) s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="8" fill="'+(last?'var(--hot)':'var(--rose)')+'" opacity="'+(last?1:.75)+'"/>';
    if(m.v>0) s+='<text x="'+(x+bw/2)+'" y="'+(y-8)+'" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)" font-family="Montserrat,Arial,sans-serif">'+moneyShort(r2(m.v))+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12.5" fill="var(--muted)" font-family="Montserrat,Arial,sans-serif" font-weight="'+(last?700:500)+'">'+m.l+'</text>'; });
  s+='</svg>';
  return '<div class="chart-card">'+s+'</div>';
}

function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2800); }
async function copiar(texto, okMsg){
  try{ await navigator.clipboard.writeText(texto); toast(okMsg||'Copiado'); return true; }
  catch(e){ toast('No se pudo copiar automáticamente. Selecciona el texto y cópialo.'); return false; }
}

const CARD = { rose:'#D78BB1', blush:'#F7D9E8', blush2:'#FBEAF2', mkl:'#EBC2D7', ink:'#4A4448', muted:'#857880', roseInk:'#9E4F7A', gold:'#A8874C', hot:'#FC76B9', line:'#EFD9E4' };
const CARD_ST = { pendiente:['#7A6D74','#F1E9ED'], abonando:['#9E4F7A','#F9E1EC'], proximo:['#8A6420','#F6EBD3'], vencido:['#A1324F','#F7D7DF'], liquidado:['#3F7556','#DCEEE3'] };
const imgCache={};
function cargarImg(src){ if(imgCache[src]) return imgCache[src]; imgCache[src]=new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); return imgCache[src]; }
function tenido(img, color, w, h){ const c=document.createElement('canvas'); c.width=Math.round(w); c.height=Math.round(h); const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height); x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,c.width,c.height); return c; }
function espaciado(ctx, text, x, y, sp, align){
  const chars=[...text]; const ws=chars.map(ch=>ctx.measureText(ch).width); const total=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);
  let cx = align==='center' ? x-total/2 : align==='right' ? x-total : x;
  const prev=ctx.textAlign; ctx.textAlign='left'; chars.forEach((ch,i)=>{ ctx.fillText(ch,cx,y); cx+=ws[i]+sp; }); ctx.textAlign=prev; return total;
}
function ajustarFuente(ctx, text, maxW, size, tpl){ let s=size; ctx.font=tpl.replace('{s}',s); while(ctx.measureText(text).width>maxW && s>18){ s-=2; ctx.font=tpl.replace('{s}',s); } return s; }
function recortar(ctx, text, maxW){ if(ctx.measureText(text).width<=maxW) return text; let t=text; while(t.length>1 && ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1); return t+'…'; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
async function dibujarEstado(c){
  const W=1080, H=1350, F='"Cormorant Garamond", Georgia, serif', M='Montserrat, Arial, sans-serif';
  try{ await Promise.all(['600 80px "Cormorant Garamond"','500 80px "Cormorant Garamond"','400 80px "Cormorant Garamond"','italic 500 40px "Cormorant Garamond"','600 30px Montserrat','500 30px Montserrat','700 30px Montserrat'].map(f=>document.fonts.load(f))); }catch(e){}
  const [wings, firma] = await Promise.all([cargarImg(WINGS_SRC), cargarImg(FIRMA_SRC)]);
  const k=calc(c), cl=data.clientas[c.clientaId]||{}, A=aj(), liq=k.estado==='liquidado';
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  // Encabezado de marca: monograma, alas, firma y "ACCESORIOS"
  x.fillStyle=CARD.rose; x.fillRect(0,0,W,400);
  x.save(); x.fillStyle=CARD.mkl; x.globalAlpha=.7; x.font='400 290px '+F; x.textAlign='center'; x.textBaseline='alphabetic'; x.fillText('MKL', W/2, 318); x.restore();
  const ww=250, wh=ww*226/446; x.drawImage(tenido(wings,'#FFFFFF',ww,wh), (W-ww)/2, 34);
  const fw=560, fh=fw*174/822; x.drawImage(tenido(firma,'#FFFFFF',fw,fh), (W-fw)/2, 170);
  x.fillStyle='#FFFFFF'; x.font='600 27px '+M; espaciado(x,'ACCESORIOS',W/2,358,9,'center');
  // Título y fecha
  x.fillStyle=CARD.roseInk; x.font='600 22px '+M; espaciado(x,'ESTADO DE CUENTA',90,478,6,'left');
  x.fillStyle=CARD.muted; x.font='500 22px '+M; x.textAlign='right'; x.fillText('Al '+fCorta(hoyISO()), W-90, 478); x.textAlign='left';
  // Nombre y producto
  x.fillStyle=CARD.ink; ajustarFuente(x, cl.nombre||'Clienta', W-180, 80, '600 {s}px '+F); x.fillText(cl.nombre||'Clienta', 90, 572);
  x.fillStyle=CARD.muted; x.font='500 28px '+M; x.fillText(recortar(x, c.producto||'', W-180), 90, 622);
  x.fillStyle=CARD.line; x.fillRect(90,664,W-180,2);
  // Saldo grande + estado
  x.fillStyle=CARD.muted; x.font='600 21px '+M; espaciado(x, liq?'TOTAL PAGADO':'SALDO PENDIENTE', 90, 726, 5, 'left');
  x.fillStyle=liq?CARD.gold:CARD.roseInk; ajustarFuente(x, money(liq?k.monto:k.saldo), 620, 124, '600 {s}px '+F); x.fillText(money(liq?k.monto:k.saldo), 84, 842);
  const st=CARD_ST[k.estado]; x.font='700 24px '+M; const lab=ESTADOS[k.estado].toUpperCase(); const tw=x.measureText(lab).width+lab.length*2.5+70;
  rrect(x, W-90-tw, 772, tw, 58, 29); x.fillStyle=st[1]; x.fill();
  x.fillStyle=st[0]; x.beginPath(); x.arc(W-90-tw+30, 801, 6, 0, Math.PI*2); x.fill(); espaciado(x, lab, W-90-tw+48, 810, 2.5, 'left');
  // Barra de progreso
  rrect(x,90,890,W-180,24,12); x.fillStyle=CARD.blush; x.fill();
  const pw=Math.max(24,(W-180)*k.pct/100); const g=x.createLinearGradient(90,0,90+pw,0); g.addColorStop(0, liq?CARD.gold:CARD.rose); g.addColorStop(1, liq?CARD.rose:CARD.hot);
  if(k.pct>0){ rrect(x,90,890,pw,24,12); x.fillStyle=g; x.fill(); }
  x.fillStyle=CARD.ink; x.font='700 26px '+M; x.fillText(k.pct+'% pagado', 90, 958);
  x.fillStyle=CARD.muted; x.font='500 24px '+M; x.textAlign='right'; x.fillText('Abonado '+money(k.abonado)+' de '+money(k.monto), W-90, 958); x.textAlign='left';
  // Cuadrícula de datos
  const gy=1000, gh=200; x.fillStyle=CARD.line; x.fillRect(90,gy,W-180,2); x.fillRect(90,gy+gh/2,W-180,2); x.fillRect(W/2,gy+18,2,gh-36); x.fillRect(90,gy+gh,W-180,2);
  const cells=[['TOTAL DE COMPRA',money(k.monto)],['TOTAL ABONADO',money(k.abonado)],['PRÓXIMO PAGO', liq?'—':(c.proximoPago?fCorta(c.proximoPago):'Por definir')],['FECHA LÍMITE', c.fechaLimite?fCorta(c.fechaLimite):'Por definir']];
  cells.forEach((cc,i)=>{ const cx = i%2===0 ? 90 : W/2+34; const cy = gy + (i<2?0:gh/2);
    x.fillStyle=CARD.muted; x.font='600 18px '+M; espaciado(x, cc[0], cx, cy+36, 4, 'left');
    x.fillStyle=CARD.ink; ajustarFuente(x, cc[1], W/2-140, 46, '600 {s}px '+F); x.fillText(cc[1], cx, cy+84);
    if(i===2 && !liq && c.proximoPago){ x.fillStyle=CARD.roseInk; x.font='600 20px '+M; x.textAlign='right'; x.fillText(money(k.montoProximo), W/2-30, cy+84); x.textAlign='left'; }
  });
  // Pie con contacto de la marca
  x.fillStyle=CARD.blush2; x.fillRect(0,1236,W,H-1236); x.fillStyle=CARD.mkl; x.fillRect(0,1236,W,2);
  const contacto=[]; if(A.whatsapp) contacto.push('WhatsApp '+telBonito(A.whatsapp)); if(A.instagram) contacto.push(A.instagram.startsWith('@')?A.instagram:'@'+A.instagram);
  const sw=58, sh=sw*226/446;
  if(contacto.length){
    x.drawImage(tenido(wings,CARD.rose,sw,sh), 90, 1272);
    x.fillStyle=CARD.roseInk; x.font='italic 500 38px '+F; x.fillText('Gracias por tu compra ♡', 166, 1306);
    x.fillStyle=CARD.ink; x.font='600 21px '+M; x.textAlign='right'; contacto.forEach((t,i)=>x.fillText(t, W-90, contacto.length===1?1300:1284+i*34)); x.textAlign='left';
  } else {
    x.drawImage(tenido(wings,CARD.rose,sw,sh), (W-sw)/2, 1256);
    x.fillStyle=CARD.roseInk; x.font='italic 500 38px '+F; x.textAlign='center'; x.fillText('Gracias por tu compra ♡', W/2, 1328); x.textAlign='left';
  }
  return cv;
}

  if(t.id==='q'){ ui.q=t.value; renderNow(); }
  else if(t.id==='msg-text' && ui.sheet){ const a=$('#msg-wa'); if(a) a.href=CANALES.whatsapp_manual.enlace(ui.sheet.tel, t.value); }
  else if(t.dataset && t.dataset.tpl){ ui.ajustesDirty=true; previewTpl(t.dataset.tpl); const s=$('#aj-status'); if(s) s.textContent='Cambios sin guardar'; }
  else if(t.closest && t.closest('#f-ajustes')){ ui.ajustesDirty=true; const s=$('#aj-status'); if(s) s.textContent='Cambios sin guardar'; }
});

document.addEventListener('change', async e=>{
  if(e.target.id!=='imp-json' || !e.target.files || !e.target.files[0]) return;
  try{
    const txt=await e.target.files[0].text(); const r=JSON.parse(txt);
    if(!r || (typeof r.clientas!=='object' && typeof r.cuentas!=='object')) throw new Error('formato');
    toast('Importando…'); const n=await Store.importar(r);
    toast('Listo: '+n.clientas+' clientas y '+n.cuentas+' apartados importados');
  }catch(ex){ console.error(ex); toast(ex&&ex.message==='formato'?'Ese archivo no es un respaldo de MiraKel.':sinConexion(ex)?'Sin conexión. Conéctate a internet para importar el respaldo.':explicarError(ex)); }
  e.target.value='';
});

/* ============ Formularios ============ */
function err(id, show, msg){ const el=$('#'+id); if(!el) return; el.hidden=!show; if(msg) el.textContent=msg; }
document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target; const btn=f.querySelector('button[type="submit"]');
  const lock=(v)=>{ if(btn) btn.disabled=v; };
  try{
  if(f.id==='f-clienta'){
    const nombre=$('#c-nombre').value.trim(); err('c-nombre-err', !nombre); if(!nombre) return;
    lock(true); const id=f.dataset.id||Store.newId('clientas'); const prev=data.clientas[id]||{};
    await Store.put('clientas', id, Object.assign({}, prev, {nombre, telefono:$('#c-tel').value.trim(), notas:$('#c-notas').value.trim(), creada:prev.creada||new Date().toISOString()}));
    cerrarHoja(); ui.clientaId=id; ui.view='ficha'; renderNow(); toast('Clienta guardada');
  }
  else if(f.id==='f-apartado'){
    let clientaId=$('#p-clienta').value; const producto=$('#p-producto').value.trim(); const monto=r2($('#p-monto').value); const flim=$('#p-flim').value;
    const nuevaNombre=$('#p-nnombre').value.trim();
    const okCl = clientaId && (clientaId!=='__nueva' || nuevaNombre);
    err('p-clienta-err', !okCl, clientaId==='__nueva'?'Escribe el nombre de la nueva clienta.':'Elige o registra a la clienta.'); err('p-producto-err', !producto); err('p-monto-err', !(monto>0)); err('p-flim-err', !flim);
    if(!okCl||!producto||!(monto>0)||!flim) return;
    lock(true);
    if(clientaId==='__nueva'){ clientaId=Store.newId('clientas'); await Store.put('clientas', clientaId, {nombre:nuevaNombre, telefono:$('#p-ntel').value.trim(), notas:'', creada:new Date().toISOString()}); }
    const id=f.dataset.id||Store.newId('cuentas'); const prev=data.cuentas[id]||{};
    const obj=Object.assign({}, prev, { clientaId, producto, monto, fechaCompra:$('#p-fcompra').value||hoyISO(), proximoPago:$('#p-fprox').value||'', montoProximo:r2($('#p-mprox').value)||0, fechaLimite:flim, notas:$('#p-notas').value.trim(), abonos:prev.abonos||[], mensajes:prev.mensajes||[], creada:prev.creada||new Date().toISOString() });
    const ant = $('#p-anticipo') ? r2($('#p-anticipo').value) : 0;
    if(!f.dataset.id && ant>0) obj.abonos=[{id:'a'+Date.now().toString(36), monto:Math.min(ant,monto), fecha:obj.fechaCompra, metodo:$('#p-metodo').value+' · anticipo', nota:''}];
    await Store.put('cuentas', id, obj);
    cerrarHoja(); ui.clientaId=clientaId; ui.view='ficha'; renderNow(); toast(f.dataset.id?'Apartado actualizado':'Apartado registrado');
  }
  else if(f.id==='f-abono'){
    const c=data.cuentas[f.dataset.id]; if(!c) return; const k=calc(c); const monto=r2($('#b-monto').value);
    if(!(monto>0)){ err('b-monto-err', true, 'Escribe un monto mayor a 0.'); return; }
    if(monto>k.saldo+0.009){ err('b-monto-err', true, 'El abono supera el saldo pendiente ('+money(k.saldo)+').'); return; }
    err('b-monto-err', false); lock(true);
    const abono={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), monto, fecha:$('#b-fecha').value||hoyISO(), metodo:$('#b-metodo').value, nota:$('#b-nota').value.trim()};
    const nuevo=Object.assign({}, c, {abonos:(c.abonos||[]).concat([abono]), proximoPago:$('#b-fprox').value||'', montoProximo:r2($('#b-mprox').value)||0});
    nuevo.id=c.id;
    await Store.put('cuentas', c.id, nuevo);
    hojaAbonoListo(nuevo, monto);
  }
  else if(f.id==='f-ajustes'){
    const plantillas={}; PLANTILLAS_INFO.forEach(([k])=>{ plantillas[k]=$('#t-'+k).value; });
    const A=aj();
    const obj={ negocio:$('#a-negocio').value.trim()||DEF_AJUSTES.negocio, whatsapp:$('#a-whatsapp').value.trim(), instagram:$('#a-instagram').value.trim(), lada:($('#a-lada').value.replace(/\D/g,'')||'52'), diasAviso:Math.max(1,Math.min(60,parseInt($('#a-dias').value,10)||7)), plantillas, automatizacion:A.automatizacion };
    lock(true); ui.ajustesDirty=false; await Store.putAjustes(obj); toast('Ajustes guardados');
  }
  }catch(ex){ console.error(ex); lock(false); toast(explicarError(ex)); }
});

Store.init();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
})();
</script>
